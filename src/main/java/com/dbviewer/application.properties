# ─── Server ───────────────────────────────────────────────
server.port=8080

# ─── H2 In-Memory DB (default for local dev) ──────────────
spring.datasource.url=jdbc:h2:mem:dbviewer;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─── MySQL (uncomment + fill in to use MySQL) ─────────────
# spring.datasource.url=jdbc:mysql://localhost:3306/dbviewer?useSSL=false&serverTimezone=UTC
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=yourpassword

# ─── PostgreSQL (uncomment + fill in to use Postgres) ─────
# spring.datasource.url=jdbc:postgresql://localhost:5432/dbviewer
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.datasource.username=postgres
# spring.datasource.password=yourpassword

# ─── JPA ──────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ─── Static Resources ─────────────────────────────────────
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# ─── Logging ──────────────────────────────────────────────
logging.level.com.dbviewer=DEBUG